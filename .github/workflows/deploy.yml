name: Deploy

on:
  push:
    branches:
      - main
      - dev
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'specs/**'
      - '.specify/**'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:
    inputs:
      env:
        description: 'cible (prod|preprod)'
        required: true
        type: choice
        options: [prod, preprod]
      rollback:
        description: 'rollback uniquement (pas de build)'
        required: false
        default: false
        type: boolean

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  resolve:
    name: Resolve env + tags
    runs-on: ubuntu-latest
    outputs:
      env: ${{ steps.set.outputs.env }}
      image_tag: ${{ steps.set.outputs.image_tag }}
      rollback: ${{ steps.set.outputs.rollback }}
      # `false` seulement pour un push sur main qui bumpe la version ; vide
      # partout ailleurs, ce qui déploie (fail open)
      deploy: ${{ steps.main.outputs.deploy }}
    steps:
      - id: set
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            ENV="${{ inputs.env }}"
            ROLLBACK="${{ inputs.rollback }}"
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            ENV=prod; ROLLBACK=false
          else
            ENV=preprod; ROLLBACK=false
          fi
          TAG=$( [[ "$ENV" == prod ]] && echo main || echo dev )
          echo "env=$ENV" >> $GITHUB_OUTPUT
          echo "image_tag=$TAG" >> $GITHUB_OUTPUT
          echo "rollback=$ROLLBACK" >> $GITHUB_OUTPUT

      # Un push sur main qui bumpe la version est un merge de release (ou un
      # hotfix bumpé) : la prod appartient à son tag, que release.yml ne
      # déploie qu'après ses gates (version = tag, notes, ancêtre de main).
      # Déployer ici enverrait le même code en prod avant elles, avec un autre
      # build : deux swaps pour une release, et des chunks du premier absents
      # du second (#139). L'image :main est construite quand même.
      # fetch-depth: 0 : le script lit package.json au commit `before`.
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          BEFORE: ${{ github.event.before }}
        run: ./scripts/resolve-main-push.sh "$BEFORE" "$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Summary
        if: steps.main.outputs.deploy == 'false'
        env:
          FROM: ${{ steps.main.outputs.from }}
          TO: ${{ steps.main.outputs.to }}
        run: |
          {
            echo "## Deploy prod laissé au tag"
            echo "- \`package.json\` passe de \`$FROM\` à \`$TO\` : merge de release"
            echo "- l'image \`:main\` est construite, la prod sera déployée par le tag \`v$TO\` (release.yml)"
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build & push image
    if: needs.resolve.outputs.rollback != 'true'
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Setup buildx
        uses: docker/setup-buildx-action@v4

      - name: Login GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase image name
        id: name
        env:
          IMG: ${{ env.IMAGE_NAME }}
        run: echo "name=${IMG,,}" >> $GITHUB_OUTPUT

      - name: Build & push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          # Mêmes build-args que release.yml : sans eux /api/health annoncerait
          # env=local sur preprod en permanence, puisque le déploiement passe
          # par un wrapper VPS qui ne transmet pas forcément NUXT_APP_ENV.
          # Pas d'APP_VERSION ici : une image de branche n'a pas de version de
          # release, le fallback package.json est le bon.
          build-args: |
            GIT_SHA=${{ github.sha }}
            APP_ENV=${{ needs.resolve.outputs.env }}
            CV_URL_FR=${{ vars.CV_URL_FR }}
            CV_URL_EN=${{ vars.CV_URL_EN }}
            TURNSTILE_SITE_KEY=${{ vars.TURNSTILE_SITE_KEY }}
            GA_ID=${{ needs.resolve.outputs.env == 'prod' && vars.GA_ID || '' }}
          tags: |
            ${{ env.REGISTRY }}/${{ steps.name.outputs.name }}:${{ needs.resolve.outputs.image_tag }}
            ${{ env.REGISTRY }}/${{ steps.name.outputs.name }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy ${{ needs.resolve.outputs.env }} on VPS
    needs: [resolve, build]
    if: always() && needs.resolve.outputs.deploy != 'false' && (needs.build.result == 'success' || needs.resolve.outputs.rollback == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Clé partagée avec le job deploy de release.yml (les groupes de
    # concurrence sont globaux au repo). Un merge de release ne déploie plus la
    # prod d'ici, mais les deux workflows visent encore le même environnement :
    # push dev puis tag rc vers preprod, push main sans bump, workflow_dispatch
    # ou rerun d'un tag vers prod. Sans cette sérialisation, deux `deploy.sh`
    # manipulent en même temps les mêmes conteneurs blue/green et le même
    # upstream nginx.
    concurrency:
      group: vps-deploy-${{ needs.resolve.outputs.env }}
      cancel-in-progress: false
    environment:
      name: ${{ needs.resolve.outputs.env }}
      url: ${{ needs.resolve.outputs.env == 'prod' && 'https://kbrdn.dev' || 'https://pre-prod.kbrdn.dev' }}
    steps:
      - name: Setup ssh
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          # passer par env var puis printf garantit un newline final propre
          # (openssh refuse une key sans trailing newline avec "error in libcrypto")
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          # normalise CRLF -> LF si copier-collé depuis windows
          sed -i 's/\r$//' ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # sanity check sans dévoiler la clé
          ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null && echo "ssh key OK"
          # La clé hôte vient du secret VPS_HOST_KEY (`ssh-ed25519 AAAA…`, lue
          # sur le VPS) : plus de scan au déploiement, ses timeouts muets ont
          # fait tomber v1.0.0 et v1.0.1 (#42, #163). Pas de repli sur un scan,
          # sinon la dépendance reste. Le sed retire un CRLF collé avec la
          # valeur ; ssh-keygen -l refuse une ligne mal formée. Son empreinte ne
          # va pas au log public : elle se cherche dans les index de scan
          # Internet et y rend l'IP d'origine.
          if [ -z "$VPS_HOST_KEY" ]; then
            echo "::error::VPS_HOST_KEY manquant, voir docs/CONFIGURATION.md (The deploy key)"
            exit 1
          fi
          printf '%s %s\n' "$VPS_HOST" "$VPS_HOST_KEY" > ~/.ssh/known_hosts
          sed -i 's/\r$//' ~/.ssh/known_hosts
          if ! ssh-keygen -l -f ~/.ssh/known_hosts >/dev/null; then
            echo "::error::VPS_HOST_KEY illisible : une ligne \`ssh-ed25519 AAAA…\`, sans nom d'hôte devant"
            exit 1
          fi

      - name: Compute image ref
        id: img
        env:
          IMG: ${{ env.IMAGE_NAME }}
          TAG: ${{ needs.resolve.outputs.image_tag }}
        run: echo "ref=ghcr.io/${IMG,,}:${TAG}" >> $GITHUB_OUTPUT

      - name: Deploy via ssh wrapper
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER || 'root' }}
          ENV: ${{ needs.resolve.outputs.env }}
          IMAGE: ${{ steps.img.outputs.ref }}
          ACTION: ${{ needs.resolve.outputs.rollback == 'true' && 'rollback' || 'deploy' }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NUXT_STUDIO_TOKEN: ${{ secrets.NUXT_STUDIO_TOKEN }}
          NUXT_APP_SECRET: ${{ secrets.NUXT_APP_SECRET }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
        run: |
          # ssh cite l'adresse résolue sur certaines erreurs (`Connection closed
          # by <ip> port 22`), que le masque du secret ne couvre pas quand
          # VPS_HOST est un nom d'hôte : masquée avant la connexion (#162).
          # Sur une clé hôte qui ne correspond pas, il imprime l'empreinte que
          # le serveur a envoyée, qui rend l'IP d'origine comme celle de Setup
          # ssh : le sed la masque, pipefail garde le code de sortie de ssh.
          getent ahosts "$VPS_HOST" | awk '!s[$1]++ {print "::add-mask::" $1}' || true
          REMOTE_CMD="ENV=$ENV IMAGE=$IMAGE GITHUB_TOKEN=$GH_TOKEN RESEND_API_KEY=$RESEND_API_KEY NUXT_STUDIO_TOKEN=$NUXT_STUDIO_TOKEN NUXT_APP_SECRET=$NUXT_APP_SECRET TURNSTILE_SECRET_KEY=$TURNSTILE_SECRET_KEY $ACTION"
          set -o pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=20 -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" "$REMOTE_CMD" 2>&1 \
            | sed -u -E 's/SHA256:[A-Za-z0-9+/]+/SHA256:***/g'

      - name: Summary
        if: always()
        run: |
          {
            echo "## Deploy ${{ needs.resolve.outputs.env }}"
            echo "- ref: \`${{ github.ref }}\`"
            echo "- sha: \`${{ github.sha }}\`"
            echo "- image: \`${{ steps.img.outputs.ref }}\`"
            echo "- action: ${{ needs.resolve.outputs.rollback == 'true' && 'rollback' || 'deploy' }}"
            echo "- url: ${{ needs.resolve.outputs.env == 'prod' && 'https://kbrdn.dev' || 'https://pre-prod.kbrdn.dev' }}"
          } >> $GITHUB_STEP_SUMMARY
