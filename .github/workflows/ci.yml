name: CI

on:
  pull_request:
    branches:
      - main
      - dev
  push:
    branches:
      - dev
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'specs/**'
      - '.specify/**'
      - '.github/ISSUE_TEMPLATE/**'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, Typecheck, Build (Bun)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Le cache global de bun seulement, jamais node_modules : la restore-key
      # ramène un node_modules construit sur un autre lock, et bun ne purge pas
      # les dossiers imbriqués périmés (ERR_MODULE_NOT_FOUND sur la PR #66).
      - name: Cache Bun deps
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Format
        run: bun run fmt:check

      - name: Typecheck
        run: bun run typecheck

      # The checks of the logic no build exercises: the dither field, the hero scenes and their
      # OG colours (kept in step with theme.css), the activity feed, the release tag routing
      - name: Script checks
        run: |
          bun scripts/dither.test.ts
          bun scripts/pixel-scenes.test.ts
          bun scripts/github-activity.test.ts
          bash scripts/resolve-release-tag.test.sh

      - name: Build
        run: bun run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}

      - name: Verify build output
        run: |
          test -d .output || { echo "::error::missing .output"; exit 1; }
          echo "build size: $(du -sh .output | cut -f1)"

      # Les images OG sont rendues à la requête : aucun step au-dessus ne les
      # exécute. Sert .output et compare /, /blog et un article à leurs
      # références (scripts/og-smoke/), puis vérifie leur <head> (lang,
      # canonical, hreflang, JSON-LD) et le sitemap ; détail dans le script.
      - name: OG images and head
        env:
          OG_SMOKE_OUT: ${{ runner.temp }}/og-smoke
        run: ./scripts/og-smoke.sh

      # Les rendus obtenus quand ils diffèrent de la référence : le runner n'a
      # pas ImageMagick, il faut les voir pour juger l'écart.
      - name: OG renders (on failure)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: og-smoke
          path: ${{ runner.temp }}/og-smoke
          if-no-files-found: ignore
