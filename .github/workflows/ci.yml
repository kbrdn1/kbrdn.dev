name: CI

on:
  pull_request:
    branches:
      - main
      - dev
  push:
    branches:
      - dev
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'specs/**'
      - '.specify/**'
      - '.github/ISSUE_TEMPLATE/**'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, Typecheck, Build (Bun)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Format
        run: bun run fmt:check

      - name: Typecheck
        run: bun run typecheck

      # The checks of the logic no build exercises: the dither field, the hero scenes and their
      # OG colours (kept in step with theme.css), the activity feed, the release tag routing
      - name: Script checks
        run: |
          bun scripts/dither.test.ts
          bun scripts/pixel-scenes.test.ts
          bun scripts/github-activity.test.ts
          bash scripts/resolve-release-tag.test.sh

      - name: Build
        run: bun run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}

      - name: Verify build output
        run: |
          test -d .output || { echo "::error::missing .output"; exit 1; }
          echo "build size: $(du -sh .output | cut -f1)"

      # Les images OG sont rendues à la requête : aucun step au-dessus ne les
      # exécute. Sert .output et compare /, /blog et un article à leurs
      # références (scripts/og-smoke/) ; détail dans le script.
      - name: OG images
        run: ./scripts/og-smoke.sh
