name: Release

# Le tag pilote le déploiement.
#
#   tag v1.1.0-rc.1  →  image :v1.1.0-rc.1  →  preprod  +  pre-release GitHub
#   tag v1.1.0       →  image :v1.1.0       →  prod     +  release GitHub
#
# `deploy.yml` reste en place et garde l'itération quotidienne (push dev →
# preprod, push main → prod) : il déclenche sur `push: branches` et n'est donc
# jamais réveillé par un tag, les deux ne se marchent pas dessus.
#
# Un seul fichier pour les deux étages, là où gwm-cli sépare release.yml et
# pre-release.yml : chez lui les matrices de build diffèrent (5 cibles, .deb,
# .rpm), ici c'est la même image des deux côtés et seuls changent
# l'environnement visé, le flag --prerelease et le chemin des notes. Deux
# fichiers ne feraient que diverger.
#
# L'aiguillage lui-même vit dans scripts/resolve-release-tag.sh, couvert par
# scripts/resolve-release-tag.test.sh — se tromper de branche ici publierait
# un candidat non validé sur kbrdn.dev.

on:
  push:
    tags:
      # Matche aussi les pré-releases (`v1.1.0-rc.1`) : elles sont aiguillées
      # par le script de résolution plutôt que filtrées ici.
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'tag à (re)publier (ex: v1.0.0 ou v1.1.0-rc.1)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  resolve:
    name: Resolve tag + validate
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.set.outputs.tag }}
      version: ${{ steps.set.outputs.version }}
      env: ${{ steps.set.outputs.env }}
      prerelease: ${{ steps.set.outputs.prerelease }}
      notes: ${{ steps.set.outputs.notes }}
      url: ${{ steps.set.outputs.url }}
      image: ${{ steps.set.outputs.image }}
    steps:
      # Sur workflow_dispatch, github.ref_name est la branche de lancement et
      # pas le tag — d'où la préférence donnée à l'input, ici et au checkout.
      # fetch-depth: 0 : le contrôle d'ascendance plus bas a besoin de
      # l'historique, un clone superficiel ne le permet pas.
      - uses: actions/checkout@v4
        with:
          # `refs/tags/` explicite, et pas le nom nu : `actions/checkout`
          # résout un nom nu comme n'importe quelle ref, donc une branche
          # nommée `v1.2.3` ferait l'affaire. Le préfixe impose que ce soit un
          # tag, et fait échouer le job si le tag n'existe pas — précondition
          # évidente d'une release, que rien ne vérifiait.
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          fetch-depth: 0

      - id: set
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: ./scripts/resolve-release-tag.sh "$TAG" "$GITHUB_REPOSITORY" >> "$GITHUB_OUTPUT"

      - name: Validate version + notes
        env:
          VERSION: ${{ steps.set.outputs.version }}
          CORE: ${{ steps.set.outputs.core }}
          NOTES: ${{ steps.set.outputs.notes }}
        run: |
          set -euo pipefail

          # package.json ne porte que la version cible : un candidat 1.1.0-rc.2
          # est un candidat de 1.1.0. La comparaison se fait donc sur le coeur
          # du SemVer, pas sur la version complète.
          PKG=$(jq -r .version package.json)
          if [[ "$PKG" != "$CORE" ]]; then
            echo "::error::package.json version=$PKG mais le tag vise $CORE — bumper package.json avant de taguer"
            exit 1
          fi

          # Échouer ici plutôt qu'après le déploiement : une release publiée
          # sans notes est un snapshot déjà visible, que corriger après coup
          # demande un `gh release edit`.
          if [[ ! -f "$NOTES" ]]; then
            echo "::error::notes de release manquantes: $NOTES — lancer /changelog $VERSION avant de taguer"
            exit 1
          fi
          echo "ok: version=$VERSION notes=$NOTES"

      # Un tag stable déploie la production. Rien n'empêchait jusqu'ici de le
      # poser sur `dev` avant le merge : package.json et les notes y sont déjà,
      # les deux gates au-dessus passaient, et prod recevait un commit non
      # fusionné. docs/RELEASE.md l'interdit, ce contrôle l'applique.
      # Les candidats ne sont pas concernés : ils vivent sur `dev`, c'est leur
      # raison d'être.
      - name: Stable tags must live on main
        if: steps.set.outputs.env == 'prod'
        env:
          TAG: ${{ steps.set.outputs.tag }}
        run: |
          set -euo pipefail
          git fetch --no-tags --quiet origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::$TAG ne pointe pas un commit de main — taguer APRÈS le merge dev → main"
            exit 1
          fi
          echo "ok: $TAG est un ancêtre de origin/main"

  build:
    name: Build & push ${{ needs.resolve.outputs.tag }}
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      sha: ${{ steps.sha.outputs.value }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.resolve.outputs.tag }}

      # `github.sha` désigne le commit de la branche de lancement sur un
      # workflow_dispatch, pas celui du tag demandé — l'image afficherait alors
      # via /api/health un sha sans rapport avec son contenu.
      - name: Resolve tagged sha
        id: sha
        run: echo "value=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup buildx
        uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Les tags de registre restent mutables : republier `:v1.1.0` écraserait
      # l'artefact d'origine. Et il ne serait pas identique — `oven/bun:1-alpine`
      # bouge, `bun install` n'est pas figé — donc le rollback vers une version
      # ne ramènerait plus ce qui a été publié. C'est précisément la propriété
      # sur laquelle repose `--image ...:vX.Y.Z`, d'où ce garde-fou.
      - name: Image already published?
        id: exists
        env:
          IMAGE: ${{ needs.resolve.outputs.image }}
        run: |
          set -uo pipefail
          OUT=$(docker manifest inspect "$IMAGE" 2>&1); RC=$?
          if [[ $RC -eq 0 ]]; then
            echo "::notice::$IMAGE existe déjà — build et push sautés, l'artefact d'origine est conservé"
            echo "found=true" >> "$GITHUB_OUTPUT"
          elif grep -qiE "manifest unknown|not found|name unknown|no such manifest|denied" <<< "$OUT"; then
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            # Fail-closed : un timeout ou une panne GHCR ne doit pas être lu
            # comme « l'image n'existe pas ». Repartir sur un build écraserait
            # un tag déjà publié dès que l'accès revient, ce que ce garde-fou
            # existe précisément pour empêcher.
            echo "::error::lecture du registre impossible pour $IMAGE (rc=$RC) — on n'en déduit rien :"
            echo "$OUT"
            exit 1
          fi

      # L'image est taguée du tag git et jamais réécrite : c'est elle qui rend
      # `deploy.sh --image ...:v1.0.0` capable de ramener une version précise,
      # là où :main et :dev sont mutables et ne désignent que « le dernier ».
      - name: Build & push
        if: steps.exists.outputs.found != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          build-args: |
            GIT_SHA=${{ steps.sha.outputs.value }}
            APP_VERSION=${{ needs.resolve.outputs.version }}
            APP_ENV=${{ needs.resolve.outputs.env }}
          tags: ${{ needs.resolve.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy ${{ needs.resolve.outputs.env }}
    needs: [resolve, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Clé partagée avec le job deploy de deploy.yml — les groupes de
    # concurrence sont globaux au repo. Sans elle, le protocole normal met deux
    # déploiements prod en vol simultanément : le merge dev → main réveille
    # deploy.yml, le push du tag qui suit réveille release.yml, et leurs
    # groupes au niveau workflow étant distincts, rien ne les sérialise. Les
    # deux `deploy.sh --env prod` visent alors les mêmes noms de conteneurs et
    # le même upstream nginx : le second `docker rm -f` celui du premier, et
    # l'image active à l'arrivée est indéterminée.
    concurrency:
      group: vps-deploy-${{ needs.resolve.outputs.env }}
      cancel-in-progress: false
    environment:
      name: ${{ needs.resolve.outputs.env }}
      url: ${{ needs.resolve.outputs.url }}
    steps:
      # Bloc repris tel quel de deploy.yml (mêmes secrets, même wrapper
      # distant). Le printf et le sed CRLF viennent d'un incident réel :
      # openssh rejette une clé sans newline final avec "error in libcrypto".
      - name: Setup ssh
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          sed -i 's/\r$//' ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null && echo "ssh key OK"
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy via ssh wrapper
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER || 'root' }}
          ENV: ${{ needs.resolve.outputs.env }}
          IMAGE: ${{ needs.resolve.outputs.image }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NUXT_STUDIO_TOKEN: ${{ secrets.NUXT_STUDIO_TOKEN }}
        run: |
          REMOTE_CMD="ENV=$ENV IMAGE=$IMAGE GITHUB_TOKEN=$GH_TOKEN RESEND_API_KEY=$RESEND_API_KEY NUXT_STUDIO_TOKEN=$NUXT_STUDIO_TOKEN deploy"
          ssh -o BatchMode=yes -o ConnectTimeout=20 "$VPS_USER@$VPS_HOST" "$REMOTE_CMD"

      # Vérifie depuis l'extérieur que c'est bien cette version qui sert le
      # trafic — pas seulement que le conteneur a démarré. deploy.sh attend
      # déjà `healthy` en interne, ce qui reste vrai même si l'upstream nginx
      # pointe sur l'autre couleur.
      - name: Verify deployed version
        env:
          URL: ${{ needs.resolve.outputs.url }}
          EXPECTED: ${{ needs.resolve.outputs.version }}
          EXPECTED_ENV: ${{ needs.resolve.outputs.env }}
          EXPECTED_SHA: ${{ needs.build.outputs.sha }}
        run: |
          set -euo pipefail
          BODY=""
          for i in 1 2 3 4 5; do
            BODY=$(curl -fsS -m 15 "$URL/api/health") && break
            echo "tentative $i échouée"
            if [[ $i -lt 5 ]]; then sleep 5; fi
          done
          if [[ -z "$BODY" ]]; then
            echo "::error::$URL/api/health injoignable après 5 tentatives"
            exit 1
          fi
          echo "$BODY"
          GOT=$(jq -r .version <<< "$BODY")
          GOT_ENV=$(jq -r .env <<< "$BODY")
          GOT_SHA=$(jq -r .sha <<< "$BODY")
          if [[ "$GOT" != "$EXPECTED" ]]; then
            echo "::error::$URL sert la version $GOT, attendu $EXPECTED"
            exit 1
          fi
          # La version seule ne suffit pas à identifier l'artefact : l'image
          # `:main` construite après le tag porte le même package.json tant que
          # personne n'a bumpé. Un déploiement sans effet passerait donc le
          # contrôle de version — le sha, lui, distingue les deux commits.
          if [[ "$GOT_SHA" != "$EXPECTED_SHA" ]]; then
            echo "::error::$URL sert le sha $GOT_SHA, attendu $EXPECTED_SHA — l'artefact tagué ne sert pas le trafic"
            exit 1
          fi
          if [[ "$GOT_ENV" != "$EXPECTED_ENV" ]]; then
            echo "::error::$URL se déclare env=$GOT_ENV, attendu $EXPECTED_ENV"
            exit 1
          fi

  release:
    name: GitHub release
    needs: [resolve, deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.resolve.outputs.tag }}

      # Publiée après un déploiement vérifié : une release ne doit pas annoncer
      # une version qui n'a pas atteint son environnement.
      #
      # Titre = le tag seul, le descriptif vit dans le fichier de notes. La
      # release est un snapshot : corriger le .md après coup ne la met pas à
      # jour, il faut `gh release edit <tag> --notes-file ...`.
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.resolve.outputs.tag }}
          NOTES: ${{ needs.resolve.outputs.notes }}
          PRERELEASE: ${{ needs.resolve.outputs.prerelease }}
        run: |
          set -euo pipefail
          # Republier un tag déjà sorti est un scénario documenté
          # (workflow_dispatch) : `create` échouerait alors que l'environnement
          # vient d'être redéployé avec succès. On met à jour au lieu de mourir.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::release $TAG déjà publiée — mise à jour des notes"
            gh release edit "$TAG" \
              --notes-file "$NOTES" \
              --prerelease="$PRERELEASE"
          else
            # --verify-tag : sans lui, `gh release create` créerait le tag
            # absent depuis la branche par défaut, et la release pointerait
            # alors un autre commit que l'image déployée.
            gh release create "$TAG" \
              --title "$TAG" \
              --notes-file "$NOTES" \
              --verify-tag \
              --prerelease="$PRERELEASE"
          fi

      - name: Summary
        if: always()
        run: |
          {
            echo "## Release ${{ needs.resolve.outputs.tag }}"
            echo "- env: ${{ needs.resolve.outputs.env }}"
            echo "- image: \`${{ needs.resolve.outputs.image }}\`"
            echo "- notes: \`${{ needs.resolve.outputs.notes }}\`"
            echo "- pre-release: ${{ needs.resolve.outputs.prerelease }}"
            echo "- url: ${{ needs.resolve.outputs.url }}"
          } >> $GITHUB_STEP_SUMMARY
